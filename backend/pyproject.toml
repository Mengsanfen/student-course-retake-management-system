[project]
name = "retake-management-api"
version = "0.3.0"
description = "高校学生课程缓考与重修管理系统 API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "bcrypt>=4.3,<6",
  "pymysql[rsa]>=1.1,<2",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".runtime/pytest-cache"
addopts = "--basetemp=.runtime/pytest-fastapi-tmp --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
